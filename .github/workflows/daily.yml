name: Update watering logs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petrichor-daily
  cancel-in-progress: false

jobs:
  update-watering-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run petrichor
        shell: bash
        run: |
          config=plants.yaml
          if [ ! -f "$config" ]; then
            config=plants.example.yaml
          fi
          python -m petrichor --config "$config" --delta

      - name: Commit updated logs
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/watering_log.csv data/watering_log_delta
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "Update watering logs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
