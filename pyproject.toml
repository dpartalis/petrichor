[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "petrichor"
version = "0.1.0"
description = "A CLI that knows when not to water — soil water balance for your garden, powered by free weather data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
petrichor = "petrichor.cli:main"

[tool.setuptools.packages.find]
include = ["petrichor*"]
