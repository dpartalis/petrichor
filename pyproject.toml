[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "petrichor"
description = "A CLI that knows when not to water — soil water balance for your garden, powered by free weather data."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tabulate>=0.9",
    "deltalake>=0.20",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
petrichor = "petrichor.cli:main"

[tool.setuptools.packages.find]
include = ["petrichor*"]

[tool.setuptools.dynamic]
version = { attr = "petrichor.__version__" }
